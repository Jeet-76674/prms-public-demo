<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRMS Pro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d6efd'/><text x='50%' y='50%' font-family='Arial, sans-serif' font-weight='bold' font-size='60' fill='white' dominant-baseline='central' text-anchor='middle'>P</text></svg>" />
  <script>
    (function () {
      try {
        var originalFetch = window.fetch || globalThis.fetch;
        if (originalFetch) {
          var currentFetch = originalFetch;
          var descriptor = {
            get: function () {
              return currentFetch;
            },
            set: function (value) {
              currentFetch = value;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (err) {
            console.warn('Could not define fetch on window:', err);
          }
          try {
            Object.defineProperty(globalThis, 'fetch', descriptor);
          } catch (err) {
            console.warn('Could not define fetch on globalThis:', err);
          }
        }
      } catch (e) {
        console.warn('Failed to configure fetch wrapper:', e);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
