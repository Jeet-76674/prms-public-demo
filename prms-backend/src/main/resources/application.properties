spring.application.name=prms-backend
server.port=${SERVER_PORT:8080}

# ==========================
# Database Configuration
# ==========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prms_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================
# Email Configuration (Requires Environment Variables in Production)
# ==========================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================
# OTP Configuration
# ==========================

prms.otp.expiry.minutes=5
prms.otp.length=6

# ==========================
# File Upload Configuration
# ==========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==========================
# File Storage Paths
# ==========================

app.upload.dir=uploads
app.resume.dir=uploads/resumes
app.profile-image.dir=uploads/profile-images
app.company-logo.dir=uploads/company-logos
app.job-description.dir=uploads/job-descriptions

# ==========================
# JWT Security (Must be supplied via environment variable)
# ==========================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# CORS Configuration
# ==========================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}

# ==========================
# Demo Mode Configuration
# ==========================

app.demo.enabled=${APP_DEMO_ENABLED:true}
app.demo.auto-reset-minutes=${APP_DEMO_AUTO_RESET_MINUTES:0}

# ==========================
# Rate Limiting Configuration
# ==========================

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
app.rate-limit.signup-per-10-minutes=${RATE_LIMIT_SIGNUP_PER_10_MINUTES:3}
app.rate-limit.otp-per-hour=${RATE_LIMIT_OTP_PER_HOUR:3}
app.rate-limit.resume-upload-per-hour=${RATE_LIMIT_RESUME_UPLOAD_PER_HOUR:5}
app.rate-limit.jd-upload-per-hour=${RATE_LIMIT_JD_UPLOAD_PER_HOUR:5}
app.rate-limit.demo-reset-per-hour=${RATE_LIMIT_DEMO_RESET_PER_HOUR:5}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:120}
app.rate-limit.unauth-per-minute=${RATE_LIMIT_UNAUTH_PER_MINUTE:60}

# ==========================
# Logging
# ==========================

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN